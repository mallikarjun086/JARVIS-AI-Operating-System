name: Continuous Integration Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Backend Lint & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Core Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary --no-cache-dir fastapi uvicorn pydantic pydantic-settings email-validator sqlalchemy aiosqlite python-jose passlib bcrypt python-multipart structlog httpx Pillow cryptography openai anthropic google-generativeai tiktoken pytest pytest-asyncio pytest-cov ruff mypy

      - name: Lint with Ruff
        run: |
          ruff check backend/app || true

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: backend
          SECRET_KEY: test_secret_key_ci_pipeline_32_characters_minimum
        run: |
          pytest backend/tests/ -v --cov=backend/app

  frontend-test:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install

      - name: Type Check & Build React App
        working-directory: ./frontend
        run: |
          npm run build
