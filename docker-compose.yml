version: "3.8"

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: jarvis_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jarvis_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jarvis_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-jarvis_os}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jarvis_admin} -d ${POSTGRES_DB:-jarvis_os}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jarvis_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ENV=production
      - DEBUG=false
      - PORT=8000
      - HOST=0.0.0.0
      - SECRET_KEY=${SECRET_KEY:-jarvis_super_secret_jwt_key_change_in_production_min_32_chars!}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-jarvis_admin}:${POSTGRES_PASSWORD:-jarvis_secure_password}@db:5432/${POSTGRES_DB:-jarvis_os}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. React Frontend Service (Nginx Web Server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jarvis_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
